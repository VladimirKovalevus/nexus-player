[package]
name = "streaming"
version = "0.1.0"
edition = "2021"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "stream", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
crossbeam = "0.8"
lofty = "0.22"
async-trait = "0.1.89"
symphonia = { path = "../../vendor/Symphonia/symphonia", features = ["all", "ogg", "vorbis", "opus"] }
tracing = "0.1"
# Artwork cache: decode whatever providers serve, re-encode as WebP.
# `image` 0.25 dropped the WebP encoder, so encoding comes from the `webp` crate.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
webp = "0.3"
sha2 = "0.10"

[dev-dependencies]
tracing = "0.1"
mockito = "1.0"
tokio-test = "0.4"
tempfile = "3.0"
bandcamp = "0.3.4"

[features]
default = []
