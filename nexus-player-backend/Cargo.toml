[package]
name = "nexus-player-backend"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Vladimir Kovalev <vladkoval805@gmail.com>"]
repository = "https://github.com/VladimirKovalevus/nexus-player"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

#===============
#=Tracing/error=
#===============
tracing = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
#===============

#===============
#===AUDIO=======
#===============
symphonia = { path = "../vendor/Symphonia/symphonia", features = ["all", "ogg", "vorbis", "opus"] }
lofty = { workspace = true }
cpal = "0.15"
resampler = "0.4.1"
biquad = "0.4"
arc-swap = "1.7.1"
crossbeam = "0.8"
rand = "0.8"
#===============

#===============
#===DATABASE====
#===============
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "sqlite",
    "macros",
    "migrate"
] }
sea-orm = { version = "1.1", features = [
    "sqlx-sqlite",
    "runtime-tokio-rustls",
    "macros",
    "with-chrono"
] }
tokio = { workspace = true }
tokio-util = { version = "0.7" }
async-trait = "0.1"
parking_lot = "0.12"
chrono = { workspace = true }
dirs = "6"
walkdir = "2"
#===============
reqwest = { workspace = true, features = ["stream", "blocking", "multipart", "json"] }
bandcamp = { path = "../vendor/bandcamp" }
rsoundcloud = { workspace = true }
sha2 = "0.10.9"
streaming = { workspace = true }


[target.'cfg(not(target_os = "android"))'.dependencies]
keyring = { version = "=3.6.3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

[dev-dependencies]
tempfile = "3.0"

[lints.clippy]
unwrap_used = "deny"
