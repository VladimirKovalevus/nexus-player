[package]
name = "nexus-player-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

#===============
#=Tracing/error=
#===============
tracing = "0.1"
thiserror = "1.0"
anyhow = "1.0"
#===============

#===============
#===AUDIO=======
#===============
symphonia = { version = "0.5", features = [
    "aac", "mp3", "flac", "vorbis", "wav", "pcm", "adpcm"
] }
lofty = "0.21"
cpal = "0.15"
arc-swap = "1.7.1"
crossbeam = "0.8"
rand = "0.8"
#===============

#===============
#===DATABASE====
#===============
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "sqlite",
    "macros",
    "migrate"
] }
sea-orm = { version = "1.1", features = [
    "sqlx-sqlite",
    "runtime-tokio-rustls",
    "macros",
    "with-chrono"
] }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
parking_lot = "0.12"
chrono = { version = "0.4", features = ["serde"] }
#===============
reqwest = { version = "0.11", features = ["stream", "blocking"] }
bandcamp = "0.3.4"
rsoundcloud = "0.2"
sha2 = "0.10.9"


[dev-dependencies]
tempfile = "3.0"

