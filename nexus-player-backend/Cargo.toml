[package]
name = "nexus-player-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

#===============
#=Tracing/error=
#===============
tracing = "0.1"
thiserror = "1.0"
anyhow = "1.0"
#===============

#===============
#===AUDIO=======
#===============
symphonia = { version = "0.5", features = [
    "aac", "mp3", "flac", "vorbis", "wav", "pcm", "adpcm"
] }
cpal = "0.15"
arc-swap = "1.7.1"
crossbeam = "0.8"
#===============

#===============
#===DATABASE====
#===============
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "sqlite",
    "macros",
    "migrate"
] }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
parking_lot = "0.12"
chrono = { version = "0.4", features = ["serde"] }
#===============

[dev-dependencies]
tempfile = "3.0"

