[package]
name = "nexus-player-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

#===============
#=Tracing/error=
#===============
tracing = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
#===============

#===============
#===AUDIO=======
#===============
symphonia = { path = "../../Symphonia/symphonia", features = ["all", "ogg", "vorbis", "opus"] }
lofty = "0.21"
cpal = "0.15"
arc-swap = "1.7.1"
crossbeam = "0.8"
rand = "0.8"
#===============

#===============
#===DATABASE====
#===============
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "sqlite",
    "macros",
    "migrate"
] }
sea-orm = { version = "1.1", features = [
    "sqlx-sqlite",
    "runtime-tokio-rustls",
    "macros",
    "with-chrono"
] }
tokio = { workspace = true }
async-trait = "0.1"
parking_lot = "0.12"
chrono = { workspace = true }
#===============
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls", "stream", "blocking"] }
bandcamp = "0.3.4"
rsoundcloud = { workspace = true }
vk-api = { workspace = true }
sha2 = "0.10.9"
streaming = { workspace = true }


[dev-dependencies]
tempfile = "3.0"

