[package]
name = "nexus-player-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

#===============
#=Tracing/error=
#===============
tracing = "0.1"
thiserror = "1.0"
#===============

#===============
#===AUDIO=======
#===============
symphonia = { version = "0.5", features = [
    "aac", "mp3", "flac", "vorbis", "wav", "pcm", "adpcm"
] }
cpal = "0.15"
#===============



