[package]
name = "nexus-player-frontend"
version = "0.1.0"
description = "Tauri application shell of Nexus Player that exposes the Rust backend to the Vue frontend."
edition = "2021"
license = "MIT"
authors = ["Vladimir Kovalev <vladkoval805@gmail.com>"]
repository = "https://github.com/VladimirKovalevus/nexus-player"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "nexus_player_frontend_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
nexus-player-backend = { path = "../../nexus-player-backend/" }
tauri = { version = "2", features = ["rustls-tls", "protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = "0.3"
chrono = { workspace = true }
streaming = { workspace = true }
rand = "0.8"

# Vendored OpenSSL for Android build

[target.'cfg(target_os = "android")'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }


[lints.clippy]
unwrap_used = "deny"
