[workspace]
resolver = "2"
members = [
    "nexus-player-backend",
    "nexus-player-frontend/src-tauri",
]

[profile.dev]
# Reduced debug info speeds up linking without losing line numbers
debug = 1
# More parallelism within each crate
codegen-units = 256

[profile.dev.package."*"]
# Compile dependencies with optimizations — they rarely change
# and this dramatically reduces overhead from heavy deps (symphonia, sea-orm, etc.)
opt-level = 3

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
anyhow = "1.0"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
streaming = { path = "vendor/streaming" }
vk-api = { path = "vendor/vk-down" }
rsoundcloud = { path = "vendor/rsoundcloud" }

[patch.crates-io]
symphonia-core = { path = "vendor/Symphonia/symphonia-core" }
symphonia-metadata = { path = "vendor/Symphonia/symphonia-metadata" }
symphonia-bundle-flac = { path = "vendor/Symphonia/symphonia-bundle-flac" }
symphonia-bundle-mp3 = { path = "vendor/Symphonia/symphonia-bundle-mp3" }
symphonia-codec-aac = { path = "vendor/Symphonia/symphonia-codec-aac" }
symphonia-codec-adpcm = { path = "vendor/Symphonia/symphonia-codec-adpcm" }
symphonia-codec-alac = { path = "vendor/Symphonia/symphonia-codec-alac" }
symphonia-codec-pcm = { path = "vendor/Symphonia/symphonia-codec-pcm" }
symphonia-codec-vorbis = { path = "vendor/Symphonia/symphonia-codec-vorbis" }
symphonia-format-isomp4 = { path = "vendor/Symphonia/symphonia-format-isomp4" }
symphonia-format-mkv = { path = "vendor/Symphonia/symphonia-format-mkv" }
symphonia-format-ogg = { path = "vendor/Symphonia/symphonia-format-ogg" }
symphonia-format-riff = { path = "vendor/Symphonia/symphonia-format-riff" }
