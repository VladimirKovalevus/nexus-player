[package]
name = "vk-api"
version = "0.1.0"
edition = "2021"

[dependencies]
# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Async runtime
tokio = { version = "1.42", features = ["full"] }
# JSON serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# URL parsing
url = "2.5"
# Error handling
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
# Environment variables
dotenv = "0.15"

[[example]]
name = "get_track"
path = "examples/get_track.rs"

[[example]]
name = "test_env"
path = "examples/test_env.rs"

[[example]]
name = "test_save_env"
path = "examples/test_save_env.rs"

[[example]]
name = "search_artist"
path = "examples/search_artist.rs"

[[example]]
name = "get_playlists"
path = "examples/get_playlists.rs"

[[example]]
name = "get_me"
path = "examples/get_me.rs"

[[example]]
name = "recommendations"
path = "examples/recommendations.rs"

[[example]]
name = "get_me_direct_auth"
path = "examples/get_me_direct_auth.rs"

[[example]]
name = "get_track_direct_auth"
path = "examples/get_track_direct_auth.rs"
