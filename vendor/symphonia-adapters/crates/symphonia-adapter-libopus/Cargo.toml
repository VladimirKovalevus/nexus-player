[package]
name = "symphonia-adapter-libopus"
description = "Adapter to use libopus with Symphonia"
version = "0.2.6"
license = "MIT OR Apache-2.0"
edition = "2024"
rust-version = "1.89"
authors = ["Austin Schey <aschey13@gmail.com>"]
repository = "https://github.com/aschey/symphonia-adapters"
homepage = "https://github.com/aschey/symphonia-adapters"
include = ["/src", "/examples", "/tests", "LICENSE-MIT", "LICENSE-APACHE"]
categories = ["multimedia", "multimedia::audio", "multimedia::encoding"]
keywords = ["audio", "codec", "symphonia", "aac", "opus"]

[dependencies]
opusic-sys = { version = "0.5.8", default-features = false }
symphonia-core = "0.5.4"
log = "0.4.28"

[features]
default = ["bundled"]
bundled = ["opusic-sys/bundled"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
cargo-args = ["-Zunstable-options", "-Zrustdoc-scrape-examples"]
