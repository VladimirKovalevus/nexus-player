[package]
name = "streaming"
version = "0.1.0"
edition = "2021"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "stream", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
crossbeam = "0.8"
lofty = "0.22"
async-trait = "0.1.89"
symphonia = { path = "../Symphonia/symphonia", features = ["all", "ogg", "vorbis", "opus"] }
tracing = "0.1"

[patch.crates-io]
symphonia-core = { path = "../Symphonia/symphonia-core" }
symphonia-metadata = { path = "../Symphonia/symphonia-metadata" }
symphonia-bundle-flac = { path = "../Symphonia/symphonia-bundle-flac" }
symphonia-bundle-mp3 = { path = "../Symphonia/symphonia-bundle-mp3" }
symphonia-codec-aac = { path = "../Symphonia/symphonia-codec-aac" }
symphonia-codec-adpcm = { path = "../Symphonia/symphonia-codec-adpcm" }
symphonia-codec-alac = { path = "../Symphonia/symphonia-codec-alac" }
symphonia-codec-pcm = { path = "../Symphonia/symphonia-codec-pcm" }
symphonia-codec-vorbis = { path = "../Symphonia/symphonia-codec-vorbis" }
symphonia-format-riff = { path = "../Symphonia/symphonia-format-riff" }
symphonia-format-ogg = { path = "../Symphonia/symphonia-format-ogg" }
symphonia-format-isomp4 = { path = "../Symphonia/symphonia-format-isomp4" }
symphonia-format-mkv = { path = "../Symphonia/symphonia-format-mkv" }
symphonia-format-caf = { path = "../Symphonia/symphonia-format-caf" }
symphonia-utils-xiph = { path = "../Symphonia/symphonia-utils-xiph" }

[dev-dependencies]
tracing = "0.1"
mockito = "1.0"
tokio-test = "0.4"
tempfile = "3.0"
bandcamp = "0.3.4"

[features]
default = []
